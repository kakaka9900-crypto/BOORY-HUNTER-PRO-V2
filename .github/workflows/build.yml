          package com.scanner.penny

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.LocalDate
          import java.time.ZoneId

          /** سجل تداول وهمي: كل تنبيه يُسجَّل كصفقة ويُقاس هل ضرب الهدف الأول أو الوقف. */
          object PaperBook {
              private lateinit var sp: SharedPreferences
              fun init(c: Context) { if (!::sp.isInitialized) sp = c.getSharedPreferences("paper", 0) }

              private fun load() = JSONArray(sp.getString("t", "[]"))
              private fun save(a: JSONArray) = sp.edit().putString("t", a.toString()).apply()
              private fun all() = load().let { a -> (0 until a.length()).map { a.getJSONObject(it) } }

              fun openTickers() = all().filter { it.getBoolean("open") }.map { it.getString("s") }

              fun open(c: Candidate) {
                  if (openTickers().contains(c.ticker)) return
                  val a = load()
                  a.put(JSONObject().put("s", c.ticker).put("e", c.entry).put("sl", c.stop).put("t1", c.t1)
                      .put("open", true).put("r", 0.0).put("ts", System.currentTimeMillis()).put("ct", 0L))
                  save(a)
              }

              fun update(prices: Map<String, Double>) {
                  val a = load()
                  val now = System.currentTimeMillis()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      if (!o.getBoolean("open")) continue
                      val p = prices[o.getString("s")] ?: continue
                      val e = o.getDouble("e"); val risk = e - o.getDouble("sl")
                      val r = when {
                          p <= o.getDouble("sl") -> -1.0
                          p >= o.getDouble("t1") -> 1.5
                          now - o.getLong("ts") > 24 * 3600_000L -> (p - e) / risk
                          else -> continue
                      }
                      o.put("open", false).put("r", r).put("ct", now)
                  }
                  save(a)
              }

              fun todayR(): Double {
                  val start = LocalDate.now().atStartOfDay(ZoneId.systemDefault()).toInstant().toEpochMilli()
                  return all().filter { !it.getBoolean("open") && it.getLong("ct") >= start }.sumOf { it.getDouble("r") }
              }

              fun summary(): String {
                  val l = all(); val closed = l.filter { !it.getBoolean("open") }
                  val wins = closed.count { it.getDouble("r") > 0 }
                  val rate = if (closed.isEmpty()) 0 else wins * 100 / closed.size
                  val sum = closed.sumOf { it.getDouble("r") }
                  return "📒 تجريبي: ${closed.size} صفقة | نجاح $rate% | إجمالي %.1fR | مفتوحة ${l.size - closed.size} | اليوم %.1fR"
                      .format(java.util.Locale.US, sum, todayR())
              }
          }
