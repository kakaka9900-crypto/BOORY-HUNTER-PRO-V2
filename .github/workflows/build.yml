          package com.scanner.penny

          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import org.jsoup.Jsoup
          import org.jsoup.parser.Parser
          import java.util.concurrent.TimeUnit

          object Http {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS).readTimeout(20, TimeUnit.SECONDS).build()

              fun get(url: String): String? = try {
                  val req = Request.Builder().url(url)
                      .header("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0 Mobile Safari/537.36")
                      .header("Accept-Language", "en-US,en;q=0.9").build()
                  client.newCall(req).execute().use { if (it.isSuccessful) it.body?.string() else null }
              } catch (e: Exception) { null }
          }

          object Finviz {
              // أسهم تحت 20$، صاعدة 3%+، حجم نسبي 1.5x+، متوسط حجم 100K+ — مرتبة بالأعلى صعودًا
              private const val BASE = "https://finviz.com/screener.ashx?v=111&f=sh_price_u20,ta_change_u3,sh_relvol_o1.5,sh_avgvol_o100&o=-change&r="

              fun scan(): List<String> {
                  val out = linkedSetOf<String>()
                  for (start in listOf(1, 21, 41)) {
                      val html = Http.get(BASE + start) ?: break
                      val doc = Jsoup.parse(html)
                      val links = doc.select("a.screener-link-primary")
                      if (links.isEmpty()) break
                      links.forEach { out.add(it.text().trim()) }
                      Thread.sleep(800)
                  }
                  return out.filter { it.isNotEmpty() && it.length <= 5 }
              }
          }

          object Yahoo {
              fun chart(sym: String): Snap? {
                  val js = Http.get("https://query1.finance.yahoo.com/v8/finance/chart/$sym?interval=1m&range=1d&includePrePost=true") ?: return null
                  return try {
                      val r = JSONObject(js).getJSONObject("chart").getJSONArray("result").getJSONObject(0)
                      val q = r.getJSONObject("indicators").getJSONArray("quote").getJSONObject(0)
                      fun arr(n: String): List<Double?> {
                          val a = q.getJSONArray(n)
                          return (0 until a.length()).map { if (a.isNull(it)) null else a.getDouble(it) }
                      }
                      val c = arr("close"); val l = arr("low"); val h = arr("high"); val v = arr("volume")
                      val idx = c.indices.filter { c[it] != null && l[it] != null && h[it] != null && v[it] != null }
                      if (idx.size < 15) return null
                      val cl = idx.map { c[it]!! }; val lo = idx.map { l[it]!! }
                      val hi = idx.map { h[it]!! }; val vo = idx.map { v[it]!! }
                      val last = cl.last()
                      val back = cl[maxOf(0, cl.size - 1 - Config.WINDOW_MIN)]
                      val prev = r.getJSONObject("meta").optDouble("chartPreviousClose", Double.NaN)
                          .let { if (it.isNaN() || it <= 0) cl.first() else it }
                      val recent = vo.takeLast(3).average()
                      val base = vo.dropLast(3).takeLast(30).average()
                      Snap(
                          last = last, change = (last / prev - 1) * 100, dayHigh = hi.max(),
                          swingLow = lo.takeLast(10).min(), spike = (last / back - 1) * 100,
                          surge = if (base > 0) recent / base else 0.0, dayVol = vo.sum()
                      )
                  } catch (e: Exception) { null }
              }

              fun news(sym: String): List<String> {
                  val x = Http.get("https://feeds.finance.yahoo.com/rss/2.0/headline?s=$sym&region=US&lang=en-US") ?: return emptyList()
                  return try {
                      Jsoup.parse(x, "", Parser.xmlParser()).select("item > title").take(3).map { it.text() }
                  } catch (e: Exception) { emptyList() }
              }
          }
          PENNY_EOF_8
          mkdir -p $(dirname 'build.gradle.kts')
          cat > 'build.gradle.kts' <<'PENNY_EOF_9'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          PENNY_EOF_9
          mkdir -p $(dirname 'gradle.properties')
          cat > 'gradle.properties' <<'PENNY_EOF_10'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          kotlin.code.style=official
          PENNY_EOF_10
          mkdir -p $(dirname 'settings.gradle.kts')
          cat > 'settings.gradle.kts' <<'PENNY_EOF_11'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PennyScanner"
          include(":app")
          PENNY_EOF_11
