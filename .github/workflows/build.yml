          package com.scanner.penny

          import kotlin.math.min

          object Analyzer {
              private val pos = listOf("fda", "approval", "approves", "contract", "merger", "acquisition", "acquire",
                  "partnership", "patent", "breakthrough", "awarded", "phase 2", "phase 3", "earnings beat",
                  "guidance", "compliance", "purchase order", "launch", "collaboration")
              private val neg = listOf("offering", "reverse split", "warrant", "dilution", "delist", "bankruptcy",
                  "going concern", "lawsuit", "investigation", "halt", "registered direct", "private placement")

              fun build(t: String, s: Snap, news: List<String>): Candidate {
                  val txt = news.joinToString(" ").lowercase()
                  val hasPos = pos.any { txt.contains(it) }
                  val negHits = neg.filter { txt.contains(it) }
                  val dollarVol = s.last * s.dayVol

                  val stage = when {
                      s.change >= 60 -> "LATE"
                      s.spike >= Config.SPIKE_PCT || (s.spike >= 7 && s.surge >= 3) -> "EXPLOSION"
                      s.spike >= 4 && s.surge >= 2 -> "EARLY"
                      else -> "WATCH"
                  }
                  var score = min(40.0, s.spike * 2.5) + min(20.0, s.surge * 4) +
                      min(15.0, dollarVol / 1e6 * 3) + min(10.0, s.change / 3) +
                      (if (hasPos) 15 else if (news.isNotEmpty()) 5 else 0)
                  if (negHits.isNotEmpty()) score -= 20
                  if (stage == "LATE") score -= 15

                  val entry = s.last
                  var stop = s.swingLow * 0.99
                  if ((entry - stop) / entry > 0.12) stop = entry * 0.88
                  if ((entry - stop) / entry < 0.03) stop = entry * 0.97
                  val risk = entry - stop
                  val riskCash = Config.CAPITAL * Config.RISK_PCT / 100
                  val shares = minOf((riskCash / risk).toInt(), (Config.CAPITAL / entry).toInt())

                  val warn = buildList {
                      if (negHits.isNotEmpty()) add("⚠️ خبر فيه كلمات خطر: " + negHits.joinToString(", "))
                      if (news.isEmpty()) add("حركة بدون خبر ظاهر (محفز غير معروف)")
                      if (stage == "LATE") add("⚠️ صاعد أكثر من 60% — خطر مطاردة القمة")
                  }.joinToString("\n")

                  return Candidate(
                      ticker = t, price = s.last, change = s.change, dollarVol = dollarVol, spike = s.spike,
                      surge = s.surge, stage = stage, score = score.toInt().coerceIn(0, 100),
                      entry = entry, stop = stop, t1 = entry + 1.5 * risk, t2 = entry + 2.5 * risk,
                      t3 = entry + 4 * risk, resist = s.dayHigh, shares = shares, news = news, warn = warn
                  )
              }
          }
