          package com.scanner.penny

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import java.time.DayOfWeek
          import java.time.ZoneId
          import java.time.ZonedDateTime
          import java.util.Locale

          fun px(v: Double): String = String.format(Locale.US, if (v < 1) "%.3f" else "%.2f", v)

          class ScanService : Service() {
              private var job: Job? = null
              private val lastAlert = mutableMapOf<String, Long>()

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  PaperBook.init(applicationContext)
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("svc", "الخدمة", NotificationManager.IMPORTANCE_LOW))
                  nm.createNotificationChannel(NotificationChannel("alerts", "تنبيهات الأسهم", NotificationManager.IMPORTANCE_HIGH))
                  val n = NotificationCompat.Builder(this, "svc").setSmallIcon(android.R.drawable.ic_menu_search)
                      .setContentTitle("ماسح الأسهم يعمل").setOngoing(true).build()
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  else startForeground(1, n)
                  ScannerState.running.value = true
                  if (job == null) job = CoroutineScope(Dispatchers.IO).launch { loop() }
                  return START_STICKY
              }

              override fun onDestroy() {
                  job?.cancel(); job = null
                  ScannerState.running.value = false
                  ScannerState.status.value = "متوقف"
              }

              private fun marketOpen(): Boolean {
                  if (Config.ALWAYS_SCAN) return true
                  val t = ZonedDateTime.now(ZoneId.of("America/New_York"))
                  if (t.dayOfWeek == DayOfWeek.SATURDAY || t.dayOfWeek == DayOfWeek.SUNDAY) return false
                  return (t.hour * 60 + t.minute) in 240 until 1200 // 4:00ص – 8:00م نيويورك
              }

              private suspend fun loop() {
                  while (currentCoroutineContext().isActive) {
                      if (!marketOpen()) {
                          ScannerState.status.value = "السوق مغلق (يعمل 4:00ص–8:00م نيويورك)"
                      } else {
                          try { scanOnce() } catch (e: CancellationException) { throw e }
                          catch (e: Exception) { ScannerState.status.value = "خطأ: ${e.message}" }
                      }
                      delay(Config.SCAN_SECONDS * 1000)
                  }
              }

              private fun scanOnce() {
                  ScannerState.status.value = "جاري المسح…"
                  val tickers = Finviz.scan()
                  if (tickers.isEmpty()) { ScannerState.status.value = "ما وصلت بيانات من Finviz (حظر مؤقت أو تغيّر الصفحة)"; return }

                  val snaps = tickers.take(25).mapNotNull { t -> Yahoo.chart(t)?.let { t to it } }
                      .filter { it.second.last >= Config.MIN_PRICE && it.second.last < 20.0 }
                  val top = snaps.sortedByDescending { it.second.spike + it.second.change / 2 }.take(Config.TOP_N)
                  val list = top.map { (t, s) -> Analyzer.build(t, s, Yahoo.news(t)) }.sortedByDescending { it.score }
                  ScannerState.list.value = list

                  // تحديث الصفقات التجريبية المفتوحة
                  val prices = PaperBook.openTickers().mapNotNull { t -> Yahoo.chart(t)?.let { t to it.last } }.toMap()
                  PaperBook.update(prices)
                  ScannerState.paper.value = PaperBook.summary()

                  val now = System.currentTimeMillis()
                  if (PaperBook.todayR() <= -Config.DAILY_LOSS_R) {
                      ScannerState.status.value = "⛔ وصلت حد الخسارة اليومي (التجريبي) — التنبيهات موقوفة اليوم"
                      return
                  }
                  for (c in list) {
                      val hot = c.stage == "EXPLOSION" || c.stage == "EARLY"
                      val cooled = now - (lastAlert[c.ticker] ?: 0L) > Config.ALERT_COOLDOWN_MIN * 60_000L
                      if (hot && cooled) {
                          lastAlert[c.ticker] = now
                          PaperBook.open(c)
                          alert(c)
                      }
                  }
                  ScannerState.paper.value = PaperBook.summary()
                  ScannerState.status.value = "آخر مسح: ${list.size} سهم قيد المتابعة"
              }

              private fun alert(c: Candidate) {
                  val tag = if (c.stage == "EXPLOSION") "🚀 انفجار" else "👀 بداية حركة"
                  val body = "${c.ticker} ${px(c.price)}$ | ${"%+.0f".format(Locale.US, c.spike)}% خلال ${Config.WINDOW_MIN}د | سكور ${c.score}\n" +
                      "دخول ${px(c.entry)} | وقف ${px(c.stop)}\n" +
                      "أهداف ${px(c.t1)} / ${px(c.t2)} / ${px(c.t3)} | الكمية ${c.shares}\n" +
                      (c.news.firstOrNull() ?: "لا خبر") + (if (c.warn.isNotEmpty()) "\n" + c.warn else "")
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = NotificationCompat.Builder(this, "alerts").setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("$tag ${c.ticker}").setContentText(body.lines().first())
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body)).setContentIntent(pi)
                      .setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_HIGH).build()
                  getSystemService(NotificationManager::class.java).notify(c.ticker.hashCode(), n)
              }
          }
