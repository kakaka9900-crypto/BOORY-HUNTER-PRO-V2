          package com.scanner.penny

          import kotlinx.coroutines.flow.MutableStateFlow

          data class Snap(
              val last: Double, val change: Double, val dayHigh: Double, val swingLow: Double,
              val spike: Double, val surge: Double, val dayVol: Double
